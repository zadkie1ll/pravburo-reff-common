name: pravburo-reff-common

services:
  pravburo-reff-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${REF_POSTGRES_DB:-pravburo_ref}
      POSTGRES_USER: ${REF_POSTGRES_USER:-pravburo_ref}
      POSTGRES_PASSWORD: ${REF_POSTGRES_PASSWORD:-change-me}
    ports:
      - "127.0.0.1:${REF_POSTGRES_PORT:-5540}:5432"
    volumes:
      - pravburo_reff_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  pravburo-reff-migrations:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${REF_POSTGRES_USER:-pravburo_ref}:${REF_POSTGRES_PASSWORD:-change-me}@pravburo-reff-postgres:5432/${REF_POSTGRES_DB:-pravburo_ref}
    depends_on:
      pravburo-reff-postgres:
        condition: service_healthy
    restart: "no"

volumes:
  pravburo_reff_postgres_data:
